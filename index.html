<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doom - GBA</title>
    <style>
        html, body, #game {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        html, body {
            overflow: hidden;
            background: #000;
        }

        #game {
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <script>
        window.EJS_player = '#game';
        window.EJS_core = 'gba';
        window.EJS_gameUrl = './games/doom.gba';
        window.EJS_gameName = 'Doom';
        window.EJS_language = 'en-US';
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        window.EJS_startOnLoaded = true;
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
