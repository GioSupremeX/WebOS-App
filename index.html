<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Actual TV Dashboard</title>
    <!-- Εισαγωγή του Bridge API της LG για τις ειδοποιήσεις -->
    <script src="webOSjs-1.5.5/webOS.js" charset="utf-8"></script>
    <style>
        body { background: #050508; color: white; font-family: sans-serif; padding: 40px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .highlight { color: #00ffcc; font-size: 32px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Premium TV Dashboard</h1>
    
    <div class="grid">
        <div class="card">
            <h2>Time & Date</h2>
            <div id="clock" class="highlight">00:00:00</div>
        </div>
        <div class="card">
            <h2>App Status</h2>
            <div id="status-info" class="highlight">Running Live</div>
        </div>
    </div>

    <script>
        // 1. Ρολόι
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }, 1000);

        // 2. Σύστημα ειδοποιήσεων LG webOS
        function showTVNotification(message) {
            if (window.webOS) {
                webOS.service.request("luna://com.webos.notification", {
                    method: "createToast",
                    parameters: { "message": message },
                    onSuccess: function(res) { console.log("Notification sent"); },
                    onFailure: function(err) { console.log("Notification failed", err); }
                });
            } else {
                console.log("Browser Notification: " + message);
            }
        }

        // 3. Έλεγχος για updates στο υπόβαθρο
        let currentEtag = null;

        async function checkForUpdates() {
            try {
                // Κάνουμε ένα ελαφρύ request (HEAD) στο GitHub για να δούμε αν άλλαξε το αρχείο
                const response = await fetch(window.location.href, { method: 'HEAD', cache: 'no-cache' });
                const newEtag = response.headers.get('ETag') || response.headers.get('Last-Modified');
                
                if (currentEtag !== null && currentEtag !== newEtag) {
                    showTVNotification("Checking for updates... New version found! Reloading...");
                    setTimeout(() => {
                        window.location.reload(true); // Αναγκαστικό reload της τηλεόρασης με τα νέα αρχεία
                    }, 3000);
                }
                currentEtag = newEtag;
            } catch (error) {
                console.error("Update check failed", error);
            }
        }

        // Εκτέλεση κατά τη φόρτωση
        window.onload = function() {
            showTVNotification("Dashboard Connected & Fully Updated!");
            
            // Έλεγχος για updates κάθε 1 λεπτό (60000ms)
            setInterval(checkForUpdates, 60000);
        }
    </script>
</body>
</html>
